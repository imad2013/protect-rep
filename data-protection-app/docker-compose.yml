version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dp_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: dataprotection
      RABBITMQ_DEFAULT_PASS: dataprotection
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp_network

  postgres:
    image: postgres:15-alpine
    container_name: dp_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dataprotection
      POSTGRES_USER: dataprotection
      POSTGRES_PASSWORD: dataprotection
    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataprotection -d dataprotection"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp_network

networks:
  dp_network:
    driver: bridge

volumes:
  postgres_data:
